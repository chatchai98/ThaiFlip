[package]
name = "thaiflip"
version = "0.1.0"
edition = "2021"
authors = ["Chatchai Jomta <chatchai.j98@gmail.com>"]
license = "MIT"
description = "A lightweight Windows Thai/English keyboard layout correction utility."
readme = "README.md"

[dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Globalization", "Win32_System_Com", "Win32_System_LibraryLoader",
  "Win32_System_Threading", "Win32_System_Variant", "Win32_System_Ole",
  "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_UI_Controls_Dialogs",
  "Win32_System_SystemInformation", "Win32_System_Registry"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
